type: repl
llm:
  type: ChatOpenAI
  model_name: gpt-4.1-2025-04-14
  max_tokens: 128
  temperature: 0
  request_timeout: 20
  max_retries: 2
llm_to_python_args:
  enforce_python_console_stop_token: False
prompt_cfg:
  base: base
  suffix: suffix
  loop_prevention: ../../common/simple_loop_prevention
  sentence_similarity_model: "all-mpnet-base-v2"
  prompt_separator: "\n\n"
  top_k: 0
  db: [ ]
api:
  include_groups:
    - dialog
emv_cfg_name: armarx_lt_mem/full_with_forgetting
